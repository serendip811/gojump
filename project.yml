name: GoJump
options:
  bundleIdPrefix: kr.gojump
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  GoJump:
    type: application
    platform: iOS
    sources:
      - path: GoJumpApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.gojump.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 아파트고점지수
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: GoJumpApp/GoJump.entitlements
    info:
      path: GoJumpApp/Info.plist
      properties:
        CFBundleDisplayName: 아파트고점지수
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: kr.gojump.app
            CFBundleURLSchemes:
              - gojump
        GOJUMP_SNAPSHOT_URL: https://serendip811.github.io/gojump/api/v1/markets/seoul/snapshot.json
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: GoJumpApp/GoJump.entitlements
      properties:
        com.apple.security.application-groups:
          - group.kr.gojump.shared
    dependencies:
      - target: GoJumpWidgetExtension
        embed: true
  GoJumpWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: GoJumpWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.gojump.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: 아파트고점지수
        CODE_SIGN_ENTITLEMENTS: GoJumpWidget/GoJumpWidget.entitlements
        SKIP_INSTALL: true
    info:
      path: GoJumpWidget/Info.plist
      properties:
        CFBundleDisplayName: 아파트고점지수
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GOJUMP_SNAPSHOT_URL: https://serendip811.github.io/gojump/api/v1/markets/seoul/snapshot.json
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GoJumpWidget/GoJumpWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.kr.gojump.shared
  GoJumpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoJumpTests
      - path: Shared
    dependencies:
      - target: GoJump
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.gojump.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  GoJump:
    build:
      targets:
        GoJump: all
        GoJumpWidgetExtension: all
        GoJumpTests: [test]
    test:
      targets:
        - GoJumpTests
